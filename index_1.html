/* Layout: a 16:9 hallway TV board. Header band (crest + clock), hero row (day letter | now/next), schedule column, "coming up" strip. Single dark-green look on purpose. */
:root {
  --field: #0a2a18;        /* deep bobcat green, page ground */
  --panel: #0f3a22;        /* raised green */
  --line: #1d5236;         /* hairlines on green */
  --gold: #f4b80c;         /* bobcat gold */
  --gold-soft: #f4b80c26;
  --chalk: #f3f1e7;        /* cream text */
  --chalk-dim: #c3cdbf;    /* secondary text */
  --ink: #0a2a18;          /* text on gold */
  --alert: #ffcf4a;
  --display: "Graduate", "Rockwell", "Georgia", serif;
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --u: min(1vw, 1.78vh);  /* one "unit" that scales with the TV */
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--field);
  color: var(--chalk);
  font-family: var(--body);
  overflow: hidden;
  cursor: default;
}
body.idle { cursor: none; }
.stage {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: calc(var(--u) * 1.6);
  padding-block: calc(var(--u) * 1.6);
  padding-left: max(calc(var(--u) * 2.2), 16px, env(safe-area-inset-left, 0px));
  padding-right: max(calc(var(--u) * 2.2), 16px, env(safe-area-inset-right, 0px));
  transition: transform 2s ease;
}

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: calc(var(--u) * 1.6);
  border-bottom: calc(var(--u) * .25) solid var(--gold);
  padding-bottom: calc(var(--u) * 1.2);
}
.crest {
  width: calc(var(--u) * 7.5); aspect-ratio: 1; flex: none;
  border-radius: 50%; background: #f4f4f0;
  border: calc(var(--u) * .3) solid var(--gold);
  display: grid; place-items: center; overflow: hidden;
}
.crest img { width: 86%; height: auto; display: block; }
.school { min-width: 0; }
.school h1 {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: calc(var(--u) * 3.4); line-height: 1; letter-spacing: .02em;
  color: var(--chalk);
}
.school p {
  margin: calc(var(--u) * .5) 0 0; font-family: var(--cond); font-weight: 600;
  text-transform: uppercase; letter-spacing: .18em;
  font-size: calc(var(--u) * 1.35); color: var(--gold);
}
.clock { margin-left: auto; text-align: right; flex: none; }
.clock .time {
  font-family: var(--cond); font-weight: 700; font-variant-numeric: tabular-nums;
  font-size: calc(var(--u) * 6); line-height: .9; letter-spacing: .01em;
}
.clock .time small { font-size: .42em; font-weight: 600; margin-left: .2em; color: var(--chalk-dim); }
.clock .date {
  font-family: var(--cond); font-weight: 600; font-size: calc(var(--u) * 1.9);
  color: var(--chalk-dim); margin-top: calc(var(--u) * .3);
}

/* ---------- main grid ---------- */
main {
  min-height: 0;
  grid-template-rows: minmax(0, 1fr);
  display: grid;
  grid-template-columns: calc(var(--u) * 24) 1fr calc(var(--u) * 30);
  gap: calc(var(--u) * 1.6);
}

/* day letter */
.day {
  background: var(--gold); color: var(--ink);
  border-radius: calc(var(--u) * 1.2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: calc(var(--u) * 1.5);
  min-height: 0;
}
.day .kicker {
  font-family: var(--cond); font-weight: 700; text-transform: uppercase;
  letter-spacing: .2em; font-size: calc(var(--u) * 1.5);
}
.day .letter {
  font-family: var(--display); font-size: calc(var(--u) * 14); line-height: .95;
  margin: calc(var(--u) * .4) 0 0;
}
.day .word {
  font-family: var(--display); font-size: calc(var(--u) * 3.2); line-height: 1;
}
.day .meta {
  margin-top: calc(var(--u) * 1.4);
  font-family: var(--cond); font-weight: 600; font-size: calc(var(--u) * 1.5);
  line-height: 1.3;
}
.day .meta span { display: block; }
.day.off { background: var(--panel); color: var(--chalk); border: 2px solid var(--line); }
.day.off .letter { font-family: var(--cond); font-weight: 800; text-transform: uppercase; font-size: calc(var(--u) * 3.9); color: var(--gold); line-height: 1.05; text-wrap: balance; margin-top: calc(var(--u) * 1); }
.day.off .word { display: none; }

/* now panel */
.now {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: calc(var(--u) * 1.2);
  padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6);
  display: flex; flex-direction: column; min-width: 0; min-height: 0;
}
.label {
  font-family: var(--cond); font-weight: 700; text-transform: uppercase;
  letter-spacing: .2em; font-size: calc(var(--u) * 1.4); color: var(--gold);
  display: flex; align-items: center; gap: .6em;
}
.label .dot {
  width: .7em; height: .7em; border-radius: 50%; background: var(--gold);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .25; } }
.now h2 {
  margin: calc(var(--u) * .6) 0 0;
  font-family: var(--display); font-weight: 400;
  font-size: calc(var(--u) * 5.4); line-height: 1.05; text-wrap: balance;
}
.now.quiet h2 { font-size: calc(var(--u) * 4.4); }
.now .range {
  font-family: var(--cond); font-weight: 600; font-size: calc(var(--u) * 2.4);
  color: var(--chalk-dim); margin-top: calc(var(--u) * .6);
  font-variant-numeric: tabular-nums;
}
.countdown {
  margin-top: auto;
  display: flex; align-items: baseline; gap: calc(var(--u) * 1.2); flex-wrap: wrap;
}
.countdown .big {
  font-family: var(--cond); font-weight: 800; font-variant-numeric: tabular-nums;
  font-size: calc(var(--u) * 7.5); line-height: .9; color: var(--chalk);
}
.countdown .what {
  font-family: var(--cond); font-weight: 600; font-size: calc(var(--u) * 2);
  color: var(--chalk-dim); text-transform: uppercase; letter-spacing: .08em;
}
.bar {
  margin-top: calc(var(--u) * 1.3);
  height: calc(var(--u) * 1.1); border-radius: 99px;
  background: var(--field); overflow: hidden; border: 1px solid var(--line);
}
.bar i { display: block; height: 100%; width: 0; background: var(--gold); border-radius: 99px; transition: width 1s linear; }
.next {
  margin-top: calc(var(--u) * 1.6);
  padding-top: calc(var(--u) * 1.3);
  border-top: 1px solid var(--line);
  font-family: var(--cond); font-weight: 600; font-size: calc(var(--u) * 2.2);
  display: flex; gap: .6em; align-items: baseline; flex-wrap: wrap;
}
.next b { color: var(--gold); text-transform: uppercase; letter-spacing: .14em; font-size: .7em; }
.now.passing { border-color: var(--gold); box-shadow: 0 0 0 calc(var(--u) * .25) var(--gold-soft) inset; }
.now.quiet .countdown .big { font-size: calc(var(--u) * 5.5); }
.day, .now, .sched { overflow: hidden; }

/* schedule column */
.sched {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: calc(var(--u) * 1.2);
  padding: calc(var(--u) * 1.8) calc(var(--u) * 2);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
}
.sched ol { list-style: none; margin: calc(var(--u) * .8) 0 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .2); flex: 1; justify-content: space-between; }
.sched li {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 1em;
  padding: calc(var(--u) * .4) calc(var(--u) * 1);
  border-radius: calc(var(--u) * .6);
  font-family: var(--cond); font-size: calc(var(--u) * 1.95); font-weight: 600; line-height: 1.15;
}
.sched li .t { font-variant-numeric: tabular-nums; color: var(--chalk-dim); font-weight: 500; }
.sched li.sub { font-size: calc(var(--u) * 1.7); padding-left: calc(var(--u) * 2.2); }
.sched li.sub .n::before { content: "↳ "; color: var(--gold); }
.sched li.done { opacity: .38; }
.sched li.cur { background: var(--gold); color: var(--ink); }
.sched li.cur .t { color: var(--ink); }
.sched li.cur.sub .n::before { color: var(--ink); }
.sched .noday {
  flex: 1; display: grid; place-items: center; text-align: center;
  font-family: var(--cond); font-size: calc(var(--u) * 2); color: var(--chalk-dim); padding: 1em;
}

/* coming up */
.coming { display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 1.6); align-items: stretch; }
.coming > .label { writing-mode: vertical-rl; transform: rotate(180deg); justify-content: center; font-size: calc(var(--u) * 1.2); }
.events { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 1.2); }
.ev {
  border: 1px solid var(--line); border-radius: calc(var(--u) * .9);
  padding: calc(var(--u) * 1) calc(var(--u) * 1.3);
  display: grid; grid-template-columns: auto 1fr; gap: calc(var(--u) * 1.1); align-items: center;
  min-width: 0;
}
.ev .cal {
  width: calc(var(--u) * 5.2); text-align: center; border-radius: calc(var(--u) * .5);
  overflow: hidden; background: var(--chalk); color: var(--ink); flex: none;
}
.ev .cal .m { background: var(--gold); font-family: var(--cond); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: calc(var(--u) * 1.05); padding: .2em 0; }
.ev .cal .d { font-family: var(--cond); font-weight: 800; font-size: calc(var(--u) * 2.6); line-height: 1.15; }
.ev .info { min-width: 0; }
.ev .name { font-family: var(--cond); font-weight: 700; font-size: calc(var(--u) * 1.8); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .when { font-family: var(--cond); font-weight: 500; font-size: calc(var(--u) * 1.4); color: var(--chalk-dim); margin-top: .2em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .tag { display: inline-block; margin-top: .35em; font-family: var(--cond); font-weight: 700; font-size: calc(var(--u) * 1); letter-spacing: .12em; text-transform: uppercase; background: var(--gold); color: var(--ink); padding: .15em .6em; border-radius: 99px; }
.chip {
  display: inline-block; margin-top: calc(var(--u) * 1);
  background: var(--ink); color: var(--alert);
  font-family: var(--cond); font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
  font-size: calc(var(--u) * 1.25); padding: .3em .8em; border-radius: 99px;
}

/* full-screen hint */
.hint {
  position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--chalk); color: var(--ink); font-family: var(--cond); font-weight: 700;
  font-size: 16px; padding: .5em 1em; border-radius: 99px; opacity: .9; transition: opacity .6s;
}
.hint.gone { opacity: 0; pointer-events: none; }

/* phone / small-window fallback: stack and scroll */
@media (max-width: 760px) {
  body { overflow: auto; }
  :root { --u: 2.4vw; }

    const d = addDays(m, i);
    DAYS[keyOf(d)] = { letter: c[0], n: +c.slice(1), sem: d.getFullYear() === 2026 ? 1 : 2 };

function nextSchoolDay(fromDate) {
  for (let i = 1; i < 120; i++) {
    const d = addDays(fromDate, i), k = keyOf(d);
    if (DAYS[k]) return { d, k, info: DAYS[k] };

  const idx = letter === "A" ? 0 : 1;
  return BELLS.map(b => ({
    name: b.p ? `Period ${b.p[idx]}` : b.name,
    start: toMin(b.start), end: toMin(b.end), kind: b.kind, sub: !!b.sub,
  }));
}

// Work out where we are in the day
function locate(segs, now) {
  const first = segs[0], last = segs[segs.length - 1];
  if (now < first.start) return { state: "before", next: first };
  if (now >= last.end) return { state: "after" };
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (now >= s.start && now < s.end) return { state: "in", seg: s, i, next: segs[i + 1] };
    const n = segs[i + 1];
    if (n && now >= s.end && now < n.start) return { state: "passing", prev: s, next: n, i };
  }
  return { state: "after" };
}

const $ = id => document.getElementById(id);
const setText = (id, t) => { const el = $(id); if (el.textContent !== t) el.textContent = t; };
const setHTML = (id, h) => { const el = $(id); if (el.innerHTML !== h) el.innerHTML = h; };
const mmss = secs => { secs = Math.max(0, Math.ceil(secs)); const h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function dayPhrase(d, today) {
  const diff = Math.round((parseKey(keyOf(d)) - parseKey(keyOf(today))) / 864e5);
  if (diff === 1) return "Tomorrow";
  if (diff < 7) return DOW[d.getDay()];
  return `${DOW[d.getDay()].slice(0, 3)}, ${MON[d.getMonth()].slice(0, 3)} ${d.getDate()}`;
}

function render() {
  const now = window.__now ? new Date(window.__now) : new Date();
  const k = keyOf(now);
  const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  // Clock
  const h = now.getHours(), h12 = ((h + 11) % 12) + 1;
  setHTML("time", `${h12}:${pad(now.getMinutes())}<small>${h < 12 ? "AM" : "PM"}</small>`);
  setText("date", `${longDate(now)}, ${now.getFullYear()}`);

  const today = DAYS[k];
  const nxt = nextSchoolDay(now);
  const nowEl = $("now");
  nowEl.classList.remove("passing", "quiet");

  // ---- Day panel ----
  const dayEl = $("day");
  if (today) {
    dayEl.classList.remove("off");
    setText("dayKicker", "Today is");
    setText("dayLetter", today.letter);
    setText("dayWord", "Day");
    const gp = gradingPeriod(k);
    setHTML("dayMeta", `<span>School day ${today.ordinal} of ${SCHOOL_DAYS.length}</span>` + (gp ? `<span>${gp}</span>` : ""));
  } else {
    dayEl.classList.add("off");
    const why = noSchoolName(k) || (now.getDay() % 6 === 0 ? "Weekend" : (k > SCHOOL_DAYS[SCHOOL_DAYS.length - 1] ? "Summer Break" : "No School"));
    setText("dayKicker", "No school today");
    setText("dayLetter", why);
    setHTML("dayMeta", nxt ? `<span>Next school day</span><span>${dayPhrase(nxt.d, now)} · ${nxt.info.letter} Day</span>` : "");
  }

  // ---- Now panel ----
  setHTML("nowChip", today && isTesting(k) ? `<span class="chip">State testing window</span>` : "");
  const bar = $("bar"), barWrap = $("barWrap");

  if (!today) {
    nowEl.classList.add("quiet");
    setText("nowLabel", "Have a great day");
    setText("nowTitle", "No classes today");
    setText("nowRange", "");
    if (nxt) {
      const secs = (parseKey(nxt.k).getTime() + toMin("8:05") * 60000 - now.getTime()) / 1000;
      const days = Math.floor(secs / 86400);
      setText("cdBig", days >= 1 ? `${days} day${days > 1 ? "s" : ""}` : mmss(secs));
      setText("cdWhat", "until classes resume");
      setHTML("next", `<b>Back to school</b> ${longDate(nxt.d)} · ${nxt.info.letter} Day`);
    } else {
      setText("cdBig", ""); setText("cdWhat", "");
      setHTML("next", `<b>See you</b> next school year, Bobcats!`);
    }
    barWrap.hidden = true;
  } else {
    const segs = segmentsFor(today.letter);
    const loc = locate(segs, nowMin);
    barWrap.hidden = false;
    let pct = 0;
    if (loc.state === "before") {
      nowEl.classList.add("quiet");
      setText("nowLabel", "Before school");
      setText("nowTitle", `Good morning, Bobcats`);
      setText("nowRange", `${today.letter} Day · Period ${today.letter === "A" ? 1 : 5} starts at 8:15`);
      setText("cdBig", mmss((loc.next.start - nowMin) * 60));
      setText("cdWhat", "until first bell");
      setHTML("next", `<b>Up next</b> First Bell at ${fmt12(loc.next.start)}`);
      barWrap.hidden = true;
    } else if (loc.state === "after") {
      nowEl.classList.add("quiet");
      setText("nowLabel", "After school");
      setText("nowTitle", "School's out");
      setText("nowRange", `Dismissed at ${fmt12(toMin(DISMISSAL))}`);
      setText("cdBig", ""); setText("cdWhat", "");
      setHTML("next", nxt ? `<b>Next school day</b> ${dayPhrase(nxt.d, now)} — ${nxt.info.letter} Day` : `<b>Have a great summer</b>`);
      barWrap.hidden = true;
    } else if (loc.state === "passing") {
      nowEl.classList.add("passing");
      setText("nowLabel", "Passing period");
      setText("nowTitle", `Head to ${loc.next.name}`);
      setText("nowRange", `${loc.next.name} starts at ${fmt12(loc.next.start)}`);
      setText("cdBig", mmss((loc.next.start - nowMin) * 60));
      setText("cdWhat", "until the tardy bell");
      pct = (nowMin - loc.prev.end) / (loc.next.start - loc.prev.end);
      setHTML("next", `<b>Then</b> ${esc(loc.next.name)} until ${fmt12(loc.next.end)}`);
    } else {
      const s = loc.seg;
      const isBell = s.kind === "bell";
      if (isBell) nowEl.classList.add("passing");
      setText("nowLabel", isBell ? "First bell has rung" : "Right now");
      setText("nowTitle", isBell ? `Head to ${loc.next.name}` : s.name);
      setText("nowRange", `${fmt12(s.start)} – ${fmt12(s.end)}`);
      setText("cdBig", mmss((s.end - nowMin) * 60));
      setText("cdWhat", isBell ? "until the tardy bell" : s.next === undefined && !loc.next ? "until dismissal" : `left in ${s.kind === "lunch" ? "lunch" : s.name.toLowerCase().startsWith("period") ? "class" : s.name.toLowerCase()}`);
      if (!loc.next) setText("cdWhat", "until dismissal");
      pct = (nowMin - s.start) / (s.end - s.start);
      if (loc.next) {
        setHTML("next", `<b>Up next</b> ${esc(loc.next.name)} at ${fmt12(loc.next.start)}`);
      } else {
        setHTML("next", `<b>Up next</b> Dismissal at ${fmt12(s.end)}` + (nxt ? ` · ${dayPhrase(nxt.d, now)} is ${nxt.info.letter} Day` : ""));
      }
    }
    bar.style.width = `${Math.min(100, Math.max(0, pct * 100)).toFixed(2)}%`;
  }

  // ---- Schedule list ----
  const listDay = today ? { letter: today.letter, label: `${today.letter} Day bell schedule` }
                        : nxt ? { letter: nxt.info.letter, label: `${dayPhrase(nxt.d, now)} · ${nxt.info.letter} Day` } : null;
  if (listDay) {
    setText("schedLabel", listDay.label);
    const segs = segmentsFor(listDay.letter);
    const rows = segs.map(s => {
      let cls = s.sub ? "sub" : "";
      if (today) {
        if (nowMin >= s.end) cls += " done";
        else if (nowMin >= s.start) cls += " cur";
      }
      const t = s.kind === "bell" ? fmt12(s.start) : `${fmt12(s.start)}–${fmt12(s.end)}`;
      return `<li class="${cls.trim()}"><span class="n">${esc(s.name)}</span><span class="t">${t}</span></li>`;
    });
    const dm = toMin(DISMISSAL);
    rows.push(`<li class="${today && nowMin >= dm ? "cur" : ""}"><span class="n">Dismissal</span><span class="t">${fmt12(dm)}</span></li>`);
    setHTML("schedList", rows.join(""));
  } else {
    setText("schedLabel", "Bell schedule");
    setHTML("schedList", `<div class="noday">The 2026–27 school year is complete.</div>`);
  }

  // ---- Coming up ----
  const items = [];
  NO_SCHOOL.forEach(([a, b, n]) => items.push({ a, b, n, off: true }));
  EVENTS.forEach(([a, b, n]) => items.push({ a, b, n, off: false }));
  const upcoming = items
    .filter(e => e.a > k && !(e.n === "Staff Days" && e.a < SCHOOL_DAYS[0] && k >= SCHOOL_DAYS[0]))
    .sort((x, y) => x.a.localeCompare(y.a))
    .slice(0, 4);
  const evHTML = upcoming.map(e => {
    const d = parseKey(e.a);
    const days = Math.round((d - parseKey(k)) / 864e5);
    const span = e.a !== e.b ? `${MON[d.getMonth()].slice(0, 3)} ${d.getDate()} – ${(() => { const z = parseKey(e.b); return (z.getMonth() !== d.getMonth() ? MON[z.getMonth()].slice(0, 3) + " " : "") + z.getDate(); })()}` : DOW[d.getDay()];
    const when = (days === 1 ? "Tomorrow" : `In ${days} days`) + (e.a !== e.b ? ` · ${span}` : "");
    return `<div class="ev${e.off ? " nosch" : ""}"><div class="cal"><div class="m">${MON[d.getMonth()].slice(0, 3)}</div><div class="d">${d.getDate()}</div></div><div class="info"><div class="name">${esc(e.n)}</div><div class="when">${when}</div>${e.off ? `<span class="tag">No school</span>` : ""}</div></div>`;
  }).join("");
  setHTML("events", evHTML || `<div class="ev"><div class="info"><div class="name">Have a great summer, Bobcats!</div></div></div>`);
}

render();
setInterval(render, 1000);

/* ---- TV helpers ---- */
// Keep the screen awake where the browser allows it
let lock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
keepAwake();
document.addEventListener("visibilitychange", keepAwake);

// Click anywhere for full screen
const hint = $("hint");
document.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch (e) {}
  keepAwake();
});
document.addEventListener("fullscreenchange", () => hint.classList.toggle("gone", !!document.fullscreenElement));
setTimeout(() => hint.classList.add("gone"), 20000);

// Hide the mouse pointer when it's idle
let idleT;
document.addEventListener("mousemove", () => {
  document.body.classList.remove("idle");
  clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add("idle"), 3000);
});

// Nudge the layout a few pixels every 5 minutes to reduce screen burn-in
const shifts = [[0, 0], [3, 2], [-2, 3], [2, -3], [-3, -2]];
let si = 0;
setInterval(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  si = (si + 1) % shifts.length;
  $("stage").style.transform = `translate(${shifts[si][0]}px, ${shifts[si][1]}px)`;
}, 300000);
</script>
